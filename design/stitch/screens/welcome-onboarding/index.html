<script>
  // Tactile Micro-interaction: Interactive Day Toggle & Haptic Sparkle
  const todayNode = document.getElementById('today-node');
  const todayIcon = document.getElementById('today-icon');
  const streakCount = document.getElementById('streak-count');
  const flameTrigger = document.getElementById('flame-trigger');
  let isDone = false;
  let streakNum = 18;

  todayNode?.addEventListener('click', () => {
    isDone = !isDone;
    if (isDone) {
      todayNode.classList.remove('bg-surface-container-highest', 'text-primary-fixed');
      todayNode.classList.add('bg-primary-fixed', 'text-surface-container-lowest', 'shadow-[0_0_14px_rgba(188,245,64,0.6)]');
      todayIcon.textContent = 'check';
      todayIcon.style.fontVariationSettings = "'FILL' 1";
      streakNum = 19;
      streakCount.textContent = '19 DAY STREAK';
    } else {
      todayNode.classList.add('bg-surface-container-highest', 'text-primary-fixed');
      todayNode.classList.remove('bg-primary-fixed', 'text-surface-container-lowest', 'shadow-[0_0_14px_rgba(188,245,64,0.6)]');
      todayIcon.textContent = 'bolt';
      todayIcon.style.fontVariationSettings = "'FILL' 0";
      streakNum = 18;
      streakCount.textContent = '18 DAY STREAK';
    }
  });

  flameTrigger?.addEventListener('click', () => {
    flameTrigger.classList.add('scale-110');
    setTimeout(() => flameTrigger.classList.remove('scale-110'), 250);
  });
